#=================================================================
# log 日志
#=================================================================
logging:
  config: classpath:logback-amour.xml

spring:
  datasource:
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
    url: jdbc:p6spy:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_ROOT:3306}/amour?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      auto-commit: true
      idle-timeout: 30000
      pool-name: Amour-HikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  redis:
    database: 1 # Redis 数据库索引（默认为 0）
    host: ${REDIS_HOST:127.0.0.1} # Redis 服务器地址
    port: ${REDIS_PORT:6379} # Redis 服务器连接端口
    password: ${REDIS_PASSWORD} # Redis 服务器连接密码（默认为空）
    timeout: 5s # 读超时时间
    connect-timeout: 5s # 链接超时时间
    lettuce:
      pool:
        max-active: 200 # 连接池最大连接数
        max-wait: -1ms # 连接池最大阻塞等待时间（使用负值表示没有限制）
        min-idle: 0 # 连接池中的最小空闲连接
        max-idle: 10 # 连接池中的最大空闲连接


############## Sa-Token 配置 (文档: https://sa-token.cc) ##############
sa-token:
  # 从 Authorization: Bearer <token> 请求头读取 token
  token-name: Authorization
  token-prefix: Bearer
  is-read-header: true
  # 前后端分离项目只认请求头，避免读取浏览器中残留的旧 Cookie
  is-read-cookie: false
  # token 有效期（单位：秒） 默认30天，-1 代表永久有效
  timeout: 2592000
  # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  active-timeout: -1
  # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
  is-share: true
  # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
  token-style: uuid
  # 是否输出操作日志
  is-log: true

aliyun-oss:
  endpoint: ${OSS_ENDPOINT:}
  accessKey: ${OSS_ACCESS_KEY:}
  secretKey: ${OSS_SECRET_KEY:}
  bucketName: ${OSS_BUCKET:}
  folderName: ${OSS_FOLDER_NAME:}
